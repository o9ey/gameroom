<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="cork" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c19a6b"/>
      <stop offset="50%" stop-color="#dfba8a"/>
      <stop offset="100%" stop-color="#a67c52"/>
    </linearGradient>
    <linearGradient id="liquid1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e66025"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <linearGradient id="liquid2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d72b8"/>
      <stop offset="100%" stop-color="#3498db"/>
    </linearGradient>
  </defs>
  <!-- Cork Stopper -->
  <path d="M 25 8 L 39 8 L 37 15 L 27 15 Z" fill="url(#cork)" stroke="#6d4c41" stroke-width="1.5" />
  <!-- Glass Bottle -->
  <path d="M 26 15 L 38 15 L 38 20 C 38 23, 44 26, 44 32 L 44 54 C 44 58, 40 60, 36 60 L 28 60 C 24 60, 20 58, 20 54 L 20 32 C 20 26, 26 23, 26 20 Z" 
        fill="#1e242b" stroke="#8fa3b0" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Liquid Layer 1 (Bottom) -->
  <path d="M 21.5 45 L 42.5 45 L 42.5 54 C 42.5 57, 39 58.5, 35 58.5 L 29 58.5 C 25 58.5, 21.5 57, 21.5 54 Z" fill="url(#liquid1)" />
  <!-- Liquid Layer 2 (Top) -->
  <rect x="21.5" y="32" width="21" height="13" fill="url(#liquid2)" />
  <!-- Glass Shine -->
  <path d="M 23 30 L 23 54" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <!-- Sparkles -->
  <polygon points="49,14 51,19 56,21 51,23 49,28 47,23 42,21 47,19" fill="#ffeb3b" />
</svg>
